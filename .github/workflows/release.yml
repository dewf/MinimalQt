name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version override (e.g. 6.12.* or 6.12.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Qt version can be configured here, overridden via a GitHub Actions repository
  # variable named QT_VERSION, or provided when triggering workflow_dispatch manually.
  QT_VERSION: ${{ inputs.qt_version || vars.QT_VERSION || '6.12.*' }}
  CMAKE_VERSION: '>=4.2.0'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-windows-x64:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: cmake -S server/cpp/_dllproject -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-Windows-x64.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/MinimalQtServer.dll", "build/MinimalQtServer.lib" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalQtServer-Windows-x64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
