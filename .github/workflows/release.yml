name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version override (e.g. 6.12.* or 6.12.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Qt version can be configured here, overridden via a GitHub Actions repository
  # variable named QT_VERSION, or provided when triggering workflow_dispatch manually.
  QT_VERSION: ${{ inputs.qt_version || vars.QT_VERSION || '6.12.*' }}
  CMAKE_VERSION: '>=4.2.0'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-windows-x86_64:
    name: Build (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSVC x64 environment
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          Get-ChildItem Env: | Where-Object { $_.Value -notmatch "[\r\n]" } | ForEach-Object {
            "$($_.Name)=$($_.Value)"
          } | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: cmake -S server/cpp/_dllproject -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-Windows-x86_64.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/MinimalQtServer.dll", "build/MinimalQtServer.lib" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MinimalQtServer-Windows-x86_64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  build-windows-arm64:
    name: Build (Windows arm64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSVC arm64 environment
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=arm64"
          Get-ChildItem Env: | Where-Object { $_.Value -notmatch "[\r\n]" } | ForEach-Object {
            "$($_.Name)=$($_.Value)"
          } | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows_arm64
          target: desktop
          arch: win64_msvc2022_arm64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: cmake -S server/cpp/_dllproject -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-Windows-arm64.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/MinimalQtServer.dll", "build/MinimalQtServer.lib" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MinimalQtServer-Windows-arm64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  build-linux-x86_64:
    name: Build (Linux x86_64)
    # Pinned to ubuntu-24.04 (glibc 2.39, GCC 13), which is the exact baseline OS
    # that Qt 6.12's official prebuilt binaries (Qt Online Installer / aqtinstall)
    # are compiled against.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            zip

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: cmake -S server/cpp/_dllproject -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_LINK_RELATIVE=ON

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-Linux-x86_64.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/libMinimalQtServer.so" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MinimalQtServer-Linux-x86_64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  build-linux-arm64:
    name: Build (Linux arm64)
    # Pinned to ubuntu-24.04-arm (glibc 2.39, GCC 13), matching Qt 6.12's reference
    # Linux ARM64 desktop platform.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            zip

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: cmake -S server/cpp/_dllproject -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_LINK_RELATIVE=ON

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-Linux-arm64.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/libMinimalQtServer.so" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MinimalQtServer-Linux-arm64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  build-macos-universal:
    name: Build (macOS Universal)
    # macOS 15 runner with Xcode 16 / macOS 15 SDK, targeting macOS 14.4+
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run nativeimpl code generation
        run: dotnet nativeimpl --force-write project.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Configure CMake
        run: >
          cmake -S server/cpp/_dllproject -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=x86_64;x86_64h;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4

      - name: Build CMake target
        run: cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $qtVer = "${{ env.QT_VERSION }}" -replace '\.\*$', ''
          $zipName = "MinimalQtServer-$tag-Qt$qtVer-macOS-universal.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "build/libMinimalQtServer.dylib" -DestinationPath $zipPath -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MinimalQtServer-macOS-universal
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows-x86_64
      - build-windows-arm64
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-universal
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          generate_release_notes: true
